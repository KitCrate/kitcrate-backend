services:
  test-db:
    image: postgres:16-alpine
    container_name: kitcrate-test-db
    environment:
      POSTGRES_USER: kitcrate
      POSTGRES_PASSWORD: kitcrate
      POSTGRES_DB: kitcrate_test
    ports:
      - "5434:5432"
    # No named volume: test data is disposable and should start empty
    # every time, unlike the dev database in docker-compose.yml.
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kitcrate -d kitcrate_test"]
      interval: 2s
      timeout: 3s
      retries: 20
