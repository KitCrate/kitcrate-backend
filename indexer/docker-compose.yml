services:
  db:
    image: postgres:16-alpine
    container_name: kitcrate-db
    environment:
      POSTGRES_USER: kitcrate
      POSTGRES_PASSWORD: kitcrate
      POSTGRES_DB: kitcrate
    ports:
      - "5433:5432"
    volumes:
      - kitcrate_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kitcrate -d kitcrate"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  kitcrate_pgdata:
